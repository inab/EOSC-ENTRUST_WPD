LocalStorage:
  # Whitelist of local directory paths which Funnel is allowed to access.
  AllowedDirs:
    - /data/entrust/FILE_SCHEME
EventWriters:
- log
Compute: local
Database: boltdb
BoltDB:
  Path: /data/funnel-work-dir/funnel.db
Worker:
  WorkDir: /data/funnel-work-dir
#  PollingRate:
#    seconds: 5
#  LogUpdateRate:
#    seconds: 5
#  LogTailSize: 10000
#  MaxParallelTransfers: 10
  Container:
    DriverCommand: singularity
    RunCommand: exec --contain --cleanenv --fakeroot --no-umask --writable-tmpfs --add-caps SYS_ADMIN -B /dev/fuse -W /data/entrust/SING_dirs/scratch/ {{range $k, $v := .Env}}{{if eq $k "TRE_WORKFLOW_DIR"}}--bind {{$v}}:/workflows:rw {{else if eq $k "TRE_INPUT_DIR"}}--bind {{$v}}:/inputs:ro {{end}}{{end}}  {{range $k, $v := .Env}}{{if not (eq $k "TRE_WORKFLOW_DIR" "TRE_INPUT_DIR")}}--env {{$k}}={{$v}} {{end}}{{end}} {{if .Workdir}}--cwd {{.Workdir}}{{end}} {{range .Volumes}}--bind {{.HostPath}}:{{.ContainerPath}}:{{if .Readonly}}ro{{else}}rw{{end}} {{end}} docker://{{.Image}} {{.Command}}
    PullCommand: exec --contain --no-umask --writable-tmpfs docker://{{.Image}} /bin/true
    StopCommand: version
