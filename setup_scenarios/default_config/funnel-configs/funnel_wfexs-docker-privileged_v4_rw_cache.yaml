GenericS3:
  - Disabled: false
    Endpoint: "THE_S3_STORE_IP:THE_S3_STORE_PORT"
    Key: "THE_S3_STORE_KEY"
    Secret: "THE_S3_STORE_SECRET"

LocalStorage:
  # Whitelist of local directory paths which Funnel is allowed to access.
  AllowedDirs:
    - /data/entrust/FILE_SCHEME
EventWriters:
- log
Compute: local
Database: boltdb
BoltDB:
  Path: /data/funnel-work-dir/funnel.db
Worker:
  WorkDir: /data/funnel-work-dir
#  PollingRate:
#    seconds: 5
#  LogUpdateRate:
#    seconds: 5
#  LogTailSize: 10000
#  MaxParallelTransfers: 10
  Container:
    RunCommand: run --rm --privileged --device /dev/fuse {{range $k, $v := .Env}}--env {{$k}}={{$v}} {{end}} {{if .Workdir}}--workdir {{.Workdir}}{{end}} {{range .Volumes}}-v {{.HostPath}}:{{.ContainerPath}}:{{if .Readonly}}ro{{else}}rw{{end}} {{end}} {{.Image}} {{.Command}}
